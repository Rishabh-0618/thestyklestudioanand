<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<title>The Style Studio Anand</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;background:linear-gradient(145deg,#111 0%,#1b1b1b 45%,#2d241d 100%);color:#fff;display:flex;justify-content:center;padding:28px 16px}
.card{width:min(100%,520px);text-align:center;padding:38px 24px 30px}
.logo{width:92px;height:92px;border-radius:50%;margin:0 auto 18px;background:linear-gradient(135deg,#f6d7a8,#b77b35);display:grid;place-items:center;color:#17120d;font-weight:900;font-size:25px;letter-spacing:-1px;box-shadow:0 12px 35px #0007}
h1{font-family:Georgia,serif;font-size:34px;margin:0 0 7px;letter-spacing:.2px}
.tag{margin:0 0 30px;color:#cfcfcf;font-size:15px}
.links{display:grid;gap:14px}
a{text-decoration:none;color:#111;background:#fff;border-radius:18px;padding:17px 18px;display:flex;align-items:center;gap:14px;font-weight:750;font-size:17px;box-shadow:0 8px 24px #0003;transition:.18s transform,.18s box-shadow}
a:hover{transform:translateY(-2px);box-shadow:0 12px 30px #0005}
.icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:19px;flex:0 0 42px}
.ig{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045)}
.fb{background:#1877f2}
.wa{background:#25d366}
.label{text-align:left;flex:1}
.small{display:block;font-size:12px;color:#777;font-weight:500;margin-top:3px}
.arrow{font-size:22px;color:#999}
.footer{margin-top:28px;color:#9e9e9e;font-size:12px}
</style>
</head>
<body>
<main class="card">
  <div class="logo">TS</div>
  <h1>The Style Studio</h1>
  <p class="tag">Anand · Stay connected with us</p>
  <section class="links">
    <a href="https://www.instagram.com/thestylestudioanand/" target="_blank" rel="noopener">
      <span class="icon ig">◎</span><span class="label">Instagram<span class="small">@thestylestudioanand</span></span><span class="arrow">›</span>
    </a>
    <a href="https://www.facebook.com/ThestylestudioAnand" target="_blank" rel="noopener">
      <span class="icon fb">f</span><span class="label">Facebook<span class="small">The Style Studio Anand</span></span><span class="arrow">›</span>
    </a>
    <a href="https://chat.whatsapp.com/ES5kotem04H5gQQCRc9vGI" target="_blank" rel="noopener">
      <span class="icon wa">◔</span><span class="label">WhatsApp Community<span class="small">Join our community</span></span><span class="arrow">›</span>
    </a>
  </section>
  <div class="footer">Scan once. Choose where you want to connect.</div>
</main>
</body>
</html>
